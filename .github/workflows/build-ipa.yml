name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Xcode Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install NPM Dependencies
        run: npm ci

      - name: 🛠️ Select Xcode Version
        run: |
          echo "Selected Xcode Version:"
          xcodebuild -version

      - name: 🚀 Expo Prebuild (Generate Native iOS Project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: ☕ Install CocoaPods Dependencies
        run: |
          pod install --project-directory=ios

      - name: 🔍 Validate CocoaPods Workspace & Dependencies
        run: |
          if [ ! -d "ios/Pods" ]; then
            echo "Error: ios/Pods directory not found! CocoaPods installation failed or was bypassed."
            exit 1
          fi

          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: Top-level CocoaPods .xcworkspace not found in ios directory!"
            exit 1
          fi

          echo "==> Verified CocoaPods Workspace: $WORKSPACE"
          echo "==> Verified Pods directory: ios/Pods"

      - name: 🏗️ Compile Unsigned iOS Binary (xcodebuild)
        run: |
          CONFIG="${{ inputs.configuration || 'Release' }}"
          echo "==> Build Configuration: $CONFIG"

          # Target top-level CocoaPods workspace only (never internal .xcodeproj/project.xcworkspace)
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          echo "==> Top-level Workspace: $WORKSPACE"

          # Extract primary app scheme using jq
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
          echo "==> Target Scheme: $SCHEME"

          # Compile targeting physical iOS devices (arm64) with full CocoaPods linkage and code-signing bypass
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 📦 Package into Sideloadable IPA (Payload Pipeline)
        run: |
          echo "==> Searching for compiled .app bundle across entire derivedData build tree..."
          APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "Error: Compiled .app bundle not found in build directory!"
            echo "==> Debugging actual build output layout:"
            ls -R build/Build/Products 2>/dev/null || ls -R build
            exit 1
          fi

          APP_NAME=$(basename "$APP_DIR")
          echo "==> Successfully located compiled .app bundle: $APP_NAME"
          echo "==> Path: $APP_DIR"

          # 1. Create standard iOS Payload directory structure
          mkdir -p Payload

          # 2. Copy the compiled .app bundle into Payload/
          cp -R "$APP_DIR" Payload/

          # 3. Compress Payload into GroceryTab.ipa
          zip -qry GroceryTab.ipa Payload
          rm -rf Payload

          # 4. Integrity verification sanity check
          echo "=========================================================="
          echo "==> Sanity check verification:"
          unzip -l GroceryTab.ipa | grep "Info.plist"
          echo "==> Output IPA file details:"
          ls -lh GroceryTab.ipa
          echo "=========================================================="

      - name: 📤 Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroceryTab-iOS-Unsigned-IPA
          path: GroceryTab.ipa
          if-no-files-found: error
          retention-days: 14
